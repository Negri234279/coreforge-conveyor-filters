# STAGING — app + full observability stack (Grafana · Prometheus · Alloy ·
# Tempo · Loki · Alertmanager) in a single compose. Builds the SAME Dockerfile
# prod uses, with prod-like env vars, isolated under the `staging.*` subdomain
# so it never collides with prod data or sessions.
#
# Sibling stacks per environment:
#   infra/dev/   (obs only — Astro dev server runs on host)
#   infra/prod/  (app + obs on the Pi, central pi-infra Grafana)
# Service/container names are unified to `coreforge-*` so every config in
# ../observability is byte-identical across envs. Consequence: dev and staging
# CANNOT run at the same time on this machine — the fixed container names
# collide. Stop one before starting the other.
#
# Topology:
#   dev host  (192.168.1.11)   ── this whole compose (app + obs + Grafana)
#   RPi       (192.168.1.7)    ── Nginx Proxy Manager (separate machine)
#
# NPM cannot join the docker network on the dev host because it lives on
# another box; it reaches the staging services via host-published ports over
# LAN. NPM proxy hosts to create on the RPi, pointing at 192.168.1.11:
#   staging.coreforge-conveyor-filters.negri.es         ->  http://192.168.1.11:8081
#   otlp.staging.coreforge-conveyor-filters.negri.es    ->  http://192.168.1.11:4320
#   grafana.staging.coreforge-conveyor-filters.negri.es ->  http://192.168.1.11:13001  (optional)
#
# Published host ports:
#   8081   app (HTTP, 0.0.0.0 — NPM needs it over LAN)
#   4320   OTLP HTTP via Alloy (0.0.0.0 — browser RUM through NPM needs it)
#   13001  Grafana (loopback by default; flip STAGING_GRAFANA_BIND=0.0.0.0 for NPM)
#   19090 / 12345  Prometheus / Alloy UIs (loopback, debugging)
#
# Bring-up:
#   npm run staging:up          # docker compose ... up -d --build
#   npm run staging:rebuild     # iterate on uncommitted changes

x-common: &common
    networks:
        - npm_proxy
    restart: unless-stopped
    logging:
        driver: json-file
        options:
            max-size: '20m'
            max-file: '3'

services:
    # ── App ──────────────────────────────────────────────────────────────
    coreforge-app:
        # Build from the local Dockerfile every time, using the repo root as
        # context. The `image:` tag is just a friendly local name; nothing
        # pushes to a registry from here.
        build:
            context: ../..
            dockerfile: Dockerfile
        image: coreforge-conveyor-filters:staging
        container_name: coreforge-app
        restart: unless-stopped
        pull_policy: build

        depends_on:
            # Soft dep: the SDK retries OTLP exports, so the app boots even if
            # Tempo is still starting.
            coreforge-tempo:
                condition: service_started

        # Host port 8081, bound to 0.0.0.0 by default so NPM on the RPi can
        # reach it over LAN.
        ports:
            - '${STAGING_BIND:-0.0.0.0}:8081:4321'

        environment:
            # ---- Identical to prod -----------------------------------------
            NODE_ENV: production
            HOST: 0.0.0.0
            PORT: '4321'
            DATA_DIR: /data

            # ---- Differs from prod by service.name + env --------------------
            OTEL_EXPORTER_OTLP_ENDPOINT: http://coreforge-tempo:4318
            OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
            # sdk-node defaults these to "otlp" when unset, which would push
            # metrics/logs at Tempo and 404 — this stack is traces-only OTLP.
            OTEL_METRICS_EXPORTER: none
            OTEL_LOGS_EXPORTER: none
            OTEL_SERVICE_NAME: coreforge-staging
            OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=coreforge,deployment.environment=staging'
            OTEL_LOG_LEVEL: error

            # Same sampling as prod so latency/volume figures are comparable.
            OTEL_TRACES_SAMPLER: parentbased_traceidratio
            OTEL_TRACES_SAMPLER_ARG: '0.1'

            # Browser RUM (Grafana Faro). The frontend SDK POSTs to NPM at
            # otlp.staging.* whose custom location /collect proxies to Alloy's
            # host-published 12347 (faro.receiver).
            FARO_COLLECTOR_URL: ${FARO_COLLECTOR_URL:-https://otlp.staging.coreforge-conveyor-filters.negri.es/collect}
            FARO_APP_NAME: coreforge-web-staging

            # Admin shortcut points at the staging Grafana (loopback by
            # default). Override if you proxy grafana.staging.* through NPM.
            GRAFANA_URL: ${GRAFANA_URL:-http://127.0.0.1:13001}

        env_file:
            - path: .env

        volumes:
            # Separate volume — staging's SQLite is throwaway, never mix with
            # prod's data. `docker volume rm coreforge-data-staging` to wipe.
            - coreforge-data-staging:/data

        networks:
            - npm_proxy

        # ---- Same hardening as prod ---------------------------------------
        user: 'node'
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        read_only: true
        tmpfs:
            - /tmp:size=64m
            - /app/.astro:uid=1000,gid=1000,size=16m

        deploy:
            resources:
                limits:
                    cpus: '1.0'
                    memory: 512M

        healthcheck:
            test:
                - CMD
                - node
                - -e
                - "fetch('http://127.0.0.1:'+process.env.PORT+'/api/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"
            interval: 30s
            timeout: 5s
            start_period: 20s
            retries: 3

        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'

    # ── Observability (shared single-source configs in ../observability) ──
    coreforge-prometheus:
        <<: *common
        image: prom/prometheus:v3.5.0
        container_name: coreforge-prometheus
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=15d'
            - '--web.enable-lifecycle'
            - '--web.enable-remote-write-receiver'
            - '--enable-feature=exemplar-storage'
        volumes:
            - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - ../observability/prometheus/rules:/etc/prometheus/rules:ro
            - ./scrape.d:/etc/prometheus/scrape.d:ro
            - prometheus-data:/prometheus
        ports:
            # 19090 because the local pi-infra core (prometheus-infra) owns 9090.
            - '127.0.0.1:19090:9090'

    coreforge-loki:
        <<: *common
        image: grafana/loki:3.5.0
        container_name: coreforge-loki
        command: ['-config.file=/etc/loki/loki-config.yaml']
        volumes:
            - ../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
            - loki-data:/loki

    coreforge-tempo:
        <<: *common
        image: grafana/tempo:2.8.1
        container_name: coreforge-tempo
        command: ['-config.file=/etc/tempo/tempo.yaml']
        volumes:
            - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
            - tempo-data:/var/tempo

    coreforge-alloy:
        <<: *common
        image: grafana/alloy:v1.9.2
        container_name: coreforge-alloy
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
        volumes:
            - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - alloy-data:/var/lib/alloy/data
        depends_on:
            - coreforge-loki
            - coreforge-tempo
        ports:
            - '127.0.0.1:12345:12345'
            # OTLP HTTP reachable by NPM on the RPi (browser RUM), remapped to
            # 4320 on the host to keep the historical NPM entry unchanged.
            - '${STAGING_OTLP_HTTP_BIND:-0.0.0.0}:4320:4318'
            # Faro RUM collector — NPM custom location /collect points here.
            - '${STAGING_OTLP_HTTP_BIND:-0.0.0.0}:12347:12347'

    # Liveness probes (blackbox). Probes the obs stack readiness + the app's
    # /api/healthz (the staging app container on the npm_proxy network).
    coreforge-blackbox:
        <<: *common
        image: prom/blackbox-exporter:v0.27.0
        container_name: coreforge-blackbox
        command: ['--config.file=/etc/blackbox/blackbox.yml']
        volumes:
            - ../observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro

    coreforge-alertmanager-init:
        image: busybox:1.37
        container_name: coreforge-alertmanager-init
        command:
            - sh
            - -c
            - 'printf "%s" "$$COREFORGE_DISCORD_WEBHOOK_URL" > /secrets/discord_webhook_url && echo ok'
        environment:
            COREFORGE_DISCORD_WEBHOOK_URL: ${COREFORGE_DISCORD_WEBHOOK_URL:-}
        volumes:
            - alertmanager-secrets:/secrets
        networks:
            - npm_proxy
        restart: 'no'

    coreforge-alertmanager:
        <<: *common
        image: prom/alertmanager:v0.28.1
        container_name: coreforge-alertmanager
        command:
            - '--config.file=/etc/alertmanager/alertmanager.yml'
            - '--storage.path=/alertmanager'
        volumes:
            - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
            - alertmanager-secrets:/etc/alertmanager/secrets:ro
            - alertmanager-data:/alertmanager
        depends_on:
            coreforge-alertmanager-init:
                condition: service_completed_successfully

    coreforge-grafana:
        <<: *common
        image: grafana/grafana:12.1.0
        container_name: coreforge-grafana
        environment:
            # Staging may be LAN/NPM-exposed — keep auth on (unlike dev's
            # anonymous admin). Set the admin password in .env.
            GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
            GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
        volumes:
            - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
            - grafana-data:/var/lib/grafana
        ports:
            # Loopback by default; flip STAGING_GRAFANA_BIND=0.0.0.0 in .env if
            # NPM proxies grafana.staging.<domain> -> 192.168.1.11:13001.
            - '${STAGING_GRAFANA_BIND:-127.0.0.1}:13001:3000'
        depends_on:
            - coreforge-prometheus
            - coreforge-loki
            - coreforge-tempo

networks:
    # Compose-owned bridge. NPM does not join (it's on the RPi); it reaches
    # services via the host-published ports above.
    npm_proxy:
        name: npm_proxy
        driver: bridge

volumes:
    coreforge-data-staging:
        name: coreforge-data-staging
    prometheus-data:
        name: coreforge-prometheus-staging
    loki-data:
        name: coreforge-loki-staging
    tempo-data:
        name: coreforge-tempo-staging
    alloy-data:
        name: coreforge-alloy-staging
    alertmanager-data:
        name: coreforge-alertmanager-staging
    alertmanager-secrets:
        name: coreforge-alertmanager-secrets-staging
    grafana-data:
        name: coreforge-grafana-staging
