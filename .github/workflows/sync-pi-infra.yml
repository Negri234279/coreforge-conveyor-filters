name: Sync infra → pi-infra

# When coreforge's infra changes land on master, mirror the relevant files into
# the central pi-infra repo (apps/coreforge + the shared-Grafana glue), open a
# PR there and auto-merge it. The pi-infra deploy poller picks the change up on
# merge.
#
# Requires a repo secret PI_INFRA_SYNC_TOKEN: a PAT (or GitHub App token) with
# `contents:write` + `pull-requests:write` on the pi-infra repo.

on:
    push:
        branches: [master]
        paths:
            - "infra/prod/**"
            - "infra/observability/**"
            - 'scripts/sync-pi-infra.sh'
            - '.github/workflows/sync-pi-infra.yml'
    workflow_dispatch: {}

concurrency:
    group: sync-pi-infra
    cancel-in-progress: false

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout coreforge (source)
              uses: actions/checkout@v4
              with:
                  path: coreforge

            - name: Checkout pi-infra (target)
              uses: actions/checkout@v4
              with:
                  repository: Negri234279/pi-infra
                  token: ${{ secrets.PI_INFRA_SYNC_TOKEN }}
                  path: pi-infra

            - name: Apply sync contract
              run: bash coreforge/scripts/sync-pi-infra.sh "${{ github.workspace }}/pi-infra"

            - name: Open PR in pi-infra
              id: cpr
              uses: peter-evans/create-pull-request@v8
              with:
                  path: pi-infra
                  token: ${{ secrets.PI_INFRA_SYNC_TOKEN }}
                  branch: sync/coreforge-infra
                  delete-branch: true
                  sign-commits: true
                  commit-message: 'chore(sync): coreforge infra @ ${{ github.sha }}'
                  title: 'chore(sync): coreforge infra'
                  body: |
                      Automated sync of coreforge's `infra/` into this repo.

                      **Source:** `${{ github.repository }}@${{ github.sha }}`

                      Mirrors (per the sync contract):
                      - `infra/prod/` → `apps/coreforge/`
                      - `infra/observability/` (minus grafana) → `apps/coreforge/observability/`
                      - app dashboards → `core/grafana/dashboards/coreforge/`
                      - datasources → `core/grafana/provisioning/datasources/coreforge.yml`

                      🤖 Generated by the `sync-pi-infra` workflow.
                  labels: |
                      automated
                      infra-sync

            - name: Auto-merge the sync PR
              # Only when a PR was actually created or updated (skipped when the
              # sync produced no changes). Prefer GitHub native auto-merge; if the
              # repo doesn't allow it, fall back to an immediate admin merge.
              if: steps.cpr.outputs.pull-request-number != ''
              env:
                  GH_TOKEN: ${{ secrets.PI_INFRA_SYNC_TOKEN }}
                  PR: ${{ steps.cpr.outputs.pull-request-number }}
                  REPO: Negri234279/pi-infra
              run: |
                  gh pr merge "$PR" -R "$REPO" --squash --auto \
                    || gh pr merge "$PR" -R "$REPO" --squash --admin
